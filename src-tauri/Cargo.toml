[package]
name = "music-mine-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "music_mine_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=2.12.1", default-features = false, features = ["json", "tls"] }
# Keep ADPCM for previously supported WAV variants; exclude unused Ogg/MKV/Vorbis defaults.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "adpcm"] }
cpal = "0.15"
lofty = "0.21"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# JPEG decoding is not in the `image` crate already pulled in by Tauri's PNG feature.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

encoding_rs = "0.8"
chardetng = "0.1"

[target.'cfg(windows)'.dependencies]
# Win32_System_Com is required for CoCreateInstance; the Shell feature does not enable it.
windows = { version = "0.58", features = ["Media", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
